<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Edward Agyapong | Content Manager</title><style>body{font:17px/1.7 Arial;color:#142a3c;margin:0}#setup{max-width:700px;margin:70px auto;padding:30px}a{color:#a84422}h1{font-family:Georgia;font-weight:400}</style><script>window.CMS_MANUAL_INIT=true;</script></head><body><main id="setup"><h1>Website content manager</h1><p id="status">Loading configuration…</p><p><a href="/">Back to website</a></p></main><script src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0-beta.0/dist/decap-cms.js"></script><script>
fetch('/admin/config.yml').then(r=>{if(!r.ok)throw Error('Could not load the editor configuration.');return r.json()}).then(config=>{if(config.backend.name!=='turbo-github'||!config.backend.turbo_site_id)throw Error('The Turbo connection is missing.');if(!window.CMS)throw Error('The editor library could not load. Please reload this page.');CMS.init({config:{...config,load_config_file:false}});document.querySelector('#setup').remove()}).catch(e=>{const status=document.querySelector('#status');if(status)status.textContent=e.message});
</script></body></html>
